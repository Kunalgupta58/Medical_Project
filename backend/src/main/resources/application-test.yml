spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

application:
  jwt:
    secret: test-secret-key-for-junit-tests-must-be-long-enough-for-hs256-algorithm
    expiration: 86400000
  document-storage:
    path: ./test-uploads
  ocr-service:
    url: http://localhost:8001
  email:
    enabled: false
