services:

  postgres:
    image: postgres:16-alpine
    container_name: eldercare_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eldercare360
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d eldercare360"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: eldercare_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/eldercare360
      DATABASE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DOCUMENT_STORAGE_PATH: /app/uploads/medical-documents
      OCR_SERVICE_URL: http://ocr:8001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      SPRING_PROFILES_ACTIVE: default
    volumes:
      - document_storage:/app/uploads/medical-documents
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  ocr:
    build:
      context: ../ocr-service
      dockerfile: Dockerfile
    container_name: eldercare_ocr
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_OCR_URL: ${VITE_OCR_URL:-http://localhost:8001}
    container_name: eldercare_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  document_storage:
